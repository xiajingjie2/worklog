name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure signing keystore
        run: |
          if [ ! -f app/keystore.jks ]; then
            keytool -genkeypair \
              -keystore app/keystore.jks \
              -storepass niuniu2026 -alias niuniu -keypass niuniu2026 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=NiuMa WorkLog, O=NiuMa, C=CN"
            git config user.name "keystore-bot"
            git config user.email "keystore-bot@users.noreply.github.com"
            git add app/keystore.jks
            git commit -m "add stable signing keystore"
            git push
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          VER=$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n 1 | tr -d '\r')
          cd app/build/outputs/apk/debug
          mv app-debug.apk "牛马APP-V${VER}.apk"
          ls -l

      - name: Show signer fingerprint
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | tail -n 1)
          FP=$("$BT/apksigner" verify --print-certs "$APK" | grep -m1 "SHA-256" | awk '{print $NF}')
          echo "certificate SHA-256: $FP"
          echo "::warning::APK_SIGNER_SHA256=$FP"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 牛马APP
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
